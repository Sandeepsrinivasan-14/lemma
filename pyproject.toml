[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lemma-cdl"
version = "0.1.0"
description = "Lemma: null-aware semantic diff and invariant verification for clinical decision logic (research prototype)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sandeep Srinivasan S" }]
keywords = ["clinical decision support", "formal verification", "SMT", "CQL", "FHIR", "health informatics"]
dependencies = ["z3-solver>=4.12"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
lemma = "lemma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lemma = ["web/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
